<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Despensa y hambre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#060504}
.r-c{--rc:#cfc8ba;--rg:rgba(207,200,186,.16)}
.r-u{--rc:#5fcf6d;--rg:rgba(95,207,109,.22)}
.r-r{--rc:#55a3ff;--rg:rgba(85,163,255,.25)}
.slot{position:relative;width:56px;height:56px;flex:none;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--rc) 62%,#120e0a);border-radius:2px;background:radial-gradient(circle at 50% 42%,var(--rg) 0,transparent 72%),linear-gradient(180deg,#18140f 0%,#0d0b09 100%);box-shadow:inset 0 -3px 6px rgba(0,0,0,.65),0 0 0 1px #070605;display:flex;align-items:center;justify-content:center;color:var(--rc)}
.slot svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--rg))}
.qty{position:absolute;right:4px;bottom:2px;font:700 13px/1 'Alegreya Sans',sans-serif;color:#f6eedd;text-shadow:0 0 3px #000,0 0 2px #000}
.panel{position:relative;box-sizing:border-box;background:linear-gradient(180deg,#16120e 0%,#0f0c0a 55%,#0c0a08 100%);border:1px solid #5e4c2c;box-shadow:inset 0 0 0 3px #0b0907,inset 0 0 0 4px #33291a,0 14px 40px rgba(0,0,0,.7)}
.cn{position:absolute;width:30px;height:30px;fill:none;stroke:#b89a55;stroke-width:1.2;pointer-events:none}
.cn.tl{left:-3px;top:-3px}.cn.tr{right:-3px;top:-3px;transform:scaleX(-1)}.cn.bl{left:-3px;bottom:-3px;transform:scaleY(-1)}.cn.br{right:-3px;bottom:-3px;transform:scale(-1,-1)}
.h{margin:0;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.05em;color:#eedcb0}
.s{font-family:'Alegreya Sans',sans-serif;color:#b9ab90}
.sec{display:flex;align-items:center;gap:12px;margin:0;font:600 15px 'Cinzel',serif;letter-spacing:.06em;color:#d8c38f}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#4d3e25,transparent)}
.food{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #2f271b;background:linear-gradient(180deg,#14100d,#0e0b09);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
.food:hover{border-color:#6b5631}
.food.on{border-color:#e2c27a;box-shadow:0 0 0 1px #e2c27a,0 0 18px rgba(226,194,122,.18)}
.chip{height:32px;padding:0 14px;border:1px solid #3e321f;border-radius:16px;background:#0e0b09;color:#c9b88f;font:500 14px 'Alegreya Sans',sans-serif;cursor:pointer}
.chip.on{border-color:#b89a55;color:#f1dfb0;background:#1d1710}
.eat{height:40px;padding:0 18px;display:flex;align-items:center;gap:8px;border-radius:20px;font:600 13px 'Cinzel',serif;letter-spacing:.05em;color:#1a1206;background:linear-gradient(180deg,#f0d38a,#c49a45);border:1px solid #f6e2a8;cursor:pointer}
.eat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.bar{height:12px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .6s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(156,201,94,.0)}30%{box-shadow:0 0 22px 4px rgba(156,201,94,.55)}100%{box-shadow:0 0 0 0 rgba(156,201,94,0)}}
</style>
</helmet>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Alegreya', Georgia, serif; color: #e8dfcc; background: radial-gradient(ellipse 75% 70% at 55% 45%, #1b1611 0%, #0d0b09 58%, #050404 100%)">
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Topbar" active="despensa" hint-size="1920px,72px"></dc-import></div>
  <div style="position: absolute; left: 0; top: 72px"><dc-import name="Retratos" active="3" hint-size="104px,1008px"></dc-import></div>

  <section class="panel" aria-label="Hambre de la party" style="position: absolute; left: 124px; top: 90px; width: 560px; height: 970px; padding: 24px 26px; display: flex; flex-direction: column; gap: 18px">
    <svg class="cn tl" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn tr" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn bl" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn br" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h2 class="h" style="font-size: 24px">Hambre de la party</h2>
      <span class="s" style="font-size: 14px">Arrastra comida sobre un retrato o pulsa Comer · usa <b style="color: #ece4d2">{{selName}}</b></span>
    </header>
    <sc-for list="{{chars}}" as="c" hint-placeholder-count="4">
      <div style="{{c.row}}">
        <div style="{{c.portrait}}">
          <span style="font: 700 16px 'Cinzel', serif; color: #e9d6a8">{{c.ini}}</span>
          <sc-if value="{{c.drop}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; inset: -6px; border: 2px dashed #9cc95e; pointer-events: none"></span>
          </sc-if>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 7px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
            <span style="white-space: nowrap; font: 600 16px 'Cinzel', serif; color: #ece4d2">{{c.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font: 600 15px 'Alegreya Sans', sans-serif; color: {{c.col}}">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{c.icon}}"></path></svg>{{c.state}}
            </span>
          </div>
          <div role="meter" aria-label="Saciedad de {{c.name}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{c.v}}" style="position: relative; height: 12px; background: #110e0b; border: 1px solid #3a2f1d; box-shadow: inset 0 1px 3px #000">
            <div class="bar" style="{{c.bar}}"></div>
            <span aria-hidden="true" style="position: absolute; left: 15%; top: -3px; bottom: -3px; width: 1px; background: #5e4c2c"></span>
            <span aria-hidden="true" style="position: absolute; left: 40%; top: -3px; bottom: -3px; width: 1px; background: #5e4c2c"></span>
            <span aria-hidden="true" style="position: absolute; left: 75%; top: -3px; bottom: -3px; width: 1px; background: #5e4c2c"></span>
          </div>
          <span class="s" style="font-size: 13px; color: #9d917b">{{c.effect}}</span>
        </div>
        <button type="button" class="eat" onClick="{{c.eat}}" aria-label="Comer: {{c.name}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0zM9 8V4M12 8V3M15 8V4"></path></svg>Comer</button>
      </div>
    </sc-for>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; background: rgba(0,0,0,.3); border: 1px solid #2c2419">
      <span class="s" style="font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #a99d86">Reservas</span>
      <span style="font: 600 20px 'Cinzel', serif; color: #ece4d2">Comida para <span style="color: #9cc95e">5 días</span> de la party</span>
      <span class="s" style="font-size: 14px">La saciedad baja 25 puntos por día de viaje.</span>
    </div>
  </section>

  <section class="panel" aria-label="Despensa" style="position: absolute; left: 700px; top: 90px; width: 1196px; height: 970px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
    <svg class="cn tl" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn tr" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn bl" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <svg class="cn br" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 28V10L10 2h18M6 24V12l6-6h12M2 10h5M10 2v5"></path><circle cx="10" cy="10" r="1.8" fill="#b89a55"></circle></svg>
    <header style="display: flex; align-items: center; gap: 14px">
      <h2 class="h" style="font-size: 24px; flex: 1">Despensa</h2>
      <div role="group" aria-label="Filtrar despensa" style="display: flex; gap: 6px">
        <button type="button" class="chip on">Todo</button><button type="button" class="chip">Raciones</button><button type="button" class="chip">Platos</button><button type="button" class="chip">Ingredientes</button>
      </div>
    </header>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h3 class="sec">{{g.t}}</h3>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{g.items}}" as="f" hint-placeholder-count="4">
            <button type="button" class="{{f.cls}}" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">
              <span class="{{f.slot}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{f.d}}"></path></svg><span class="qty">{{f.q}}</span></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
                <span style="font: 600 15px 'Alegreya Sans', sans-serif; color: {{f.nc}}">{{f.n}}</span>
                <span style="display: flex; align-items: center; gap: 8px; font: 14px 'Alegreya Sans', sans-serif">
                  <span style="color: #9cc95e; font-weight: 700">{{f.sat}}</span>
                  <span style="color: #8f846f">·</span>
                  <span style="color: #b9ab90">{{f.w}}</span>
                </span>
                <span style="font: 13px 'Alegreya Sans', sans-serif; color: #9d917b">{{f.note}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sat: [86, 58, 27, 8], sel: 'rac', last: -1 }; }
  renderVals() {
    const IC = {
      bread: 'M4 13c0-4 3.6-7 8-7s8 3 8 7v5H4zM8.5 9.5l1 2.5M12 8.5v3M15.5 9.5l-1 2.5',
      meat: 'M15 3.5a5.5 5.5 0 0 1 0 11c-1.6 0-2.8-.6-3.8-1.6L6.5 17.6a2 2 0 1 1-2.1 2 2 2 0 1 1 2-2.1l4.7-4.7c-1-1-1.6-2.2-1.6-3.8A5.5 5.5 0 0 1 15 3.5z',
      apple: 'M12 7.5c-3-2-8-1-8 4.5 0 5 3 9 5 9 1 0 2-.5 3-.5s2 .5 3 .5c2 0 5-4 5-9 0-5.5-5-6.5-8-4.5zM12 7.5c0-2 1-3.5 3-4.5',
      bowl: 'M3 11h18a9 9 0 0 1-18 0zM8.5 8c0-1 1-1.2 1-2.2S8.5 4.5 8.5 3.5M12 8c0-1 1-1.2 1-2.2S12 4.5 12 3.5M15.5 8c0-1 1-1.2 1-2.2s-1-1.3-1-2.3',
      pie: 'M3 14h18l-2 5H5zM4 14c1-5 4.5-8 8-8s7 3 8 8M9 10l1 2M14 9l-1 3',
      mushroom: 'M4 12a8 7 0 0 1 16 0zM10 12v7a2 2 0 0 0 4 0v-7',
      herb: 'M12 21V10M12 10C12 6 9 3 5 3c0 4 3 7 7 7zM12 15c0-3.5 3-6.5 7-6.5 0 4-3 6.5-7 6.5z',
      cheese: 'M3 17l8-11 10 6v5zM3 17h18M8 13h.01M14 14h.01M16 11h.01',
      sack: 'M8 4h8l-1 3c3 1.5 5 4.5 5 8a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6c0-3.5 2-6.5 5-8z',
      flask: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M7.5 15h9'
    };
    const foods = {
      rac: { n: 'Raciones de viaje', d: IC.bread, r: 'c', q: 12, s: 30, w: '1 kg c/u', note: 'Ración de un día' },
      pan: { n: 'Pan de piedra enano', d: IC.bread, r: 'c', q: 2, s: 25, w: '0,5 kg', note: 'No se estropea' },
      sec: { n: 'Carne seca', d: IC.meat, r: 'c', q: 3, s: 20, w: '0,3 kg', note: 'Da sed' },
      que: { n: 'Queso curado', d: IC.cheese, r: 'c', q: 2, s: 15, w: '0,5 kg', note: 'Ingrediente: Pastel' },
      est: { n: 'Estofado de jabalí', d: IC.bowl, r: 'u', q: 4, s: 50, w: '0,8 kg', note: '+1d4 PV temporales' },
      pas: { n: 'Pastel de setas', d: IC.pie, r: 'u', q: 2, s: 40, w: '0,6 kg', note: 'Ventaja en 1 salvación CON' },
      sop: { n: 'Sopa de lentejas', d: IC.bowl, r: 'c', q: 3, s: 35, w: '0,7 kg', note: 'Caliente: quita frío' },
      hid: { n: 'Hidromiel de los clanes', d: IC.flask, r: 'r', q: 1, s: 20, w: '1 kg', note: 'Inmune a asustado 1 h' },
      man: { n: 'Manzanas', d: IC.apple, r: 'c', q: 7, s: 10, w: '0,2 kg', note: 'Ingrediente: Pastel' },
      jab: { n: 'Carne de jabalí cruda', d: IC.meat, r: 'c', q: 3, s: 5, w: '1 kg', note: 'Cocinar: Estofado' },
      set: { n: 'Seta brillante', d: IC.mushroom, r: 'c', q: 6, s: 5, w: '0,1 kg', note: 'Ingrediente · alquimia' },
      har: { n: 'Saco de harina', d: IC.sack, r: 'c', q: 1, s: 0, w: '2 kg', note: 'Ingrediente: Pan, Pastel' }
    };
    const sel = this.state.sel;
    const mk = (k) => {
      const f = foods[k];
      return {
        n: f.n, d: f.d, q: String(f.q), sat: f.s ? '+' + f.s + ' saciedad' : 'No se come solo', w: f.w, note: f.note,
        nc: f.r === 'u' ? '#7fdc8a' : f.r === 'r' ? '#7ab6ff' : '#ece4d2',
        slot: 'slot r-' + f.r, cls: k === sel ? 'food on' : 'food', pressed: k === sel ? 'true' : 'false',
        pick: () => this.setState({ sel: k })
      };
    };
    const groups = [
      { t: 'Raciones', items: ['rac', 'pan', 'sec', 'que'].map(mk) },
      { t: 'Platos cocinados', items: ['est', 'pas', 'sop', 'hid'].map(mk) },
      { t: 'Ingredientes', items: ['man', 'jab', 'set', 'har'].map(mk) }
    ];
    const lev = (v) => v >= 75 ? ['Saciado', '#9cc95e', 'M5 12.5l4.5 4.5L19 7', 'Ventaja en salvaciones contra agotamiento'] :
      v >= 40 ? ['Normal', '#c9a65a', IC.bowl, 'Sin efectos'] :
      v >= 15 ? ['Hambriento', '#e0883a', IC.bowl, 'No recupera dados de golpe en descanso corto'] :
      ['Famélico', '#e0534d', 'M12 3l10 18H2zM12 10v5M12 18v.01', '+1 nivel de agotamiento cada día'];
    const raw = [
      { name: 'Aldric Varn', ini: 'AV', tint: '#6f8fb8' }, { name: 'Nerys Valtëa', ini: 'NV', tint: '#9a78d0' },
      { name: 'Brom Hierroforja', ini: 'BH', tint: '#c08e4f' }, { name: 'Ysolde Mirra', ini: 'YM', tint: '#4fa07f' }
    ];
    const sat = this.state.sat;
    const chars = raw.map((c, i) => {
      const v = sat[i];
      const L = lev(v);
      const hot = i === 3 && this.state.last === -1;
      return {
        ...c, v, state: L[0], col: L[1], icon: L[2], effect: L[3], drop: hot,
        row: 'display:flex;align-items:center;gap:16px;padding:14px;border:1px solid ' + (v < 15 ? '#5a2321' : '#2c2419') + ';background:' + (v < 15 ? 'rgba(120,24,20,.14)' : 'rgba(0,0,0,.2)') + (this.state.last === i ? ';animation:flash .9s ease-out' : ''),
        portrait: 'position:relative;width:64px;height:74px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid ' + c.tint + ';background:linear-gradient(180deg,' + c.tint + '88,#0b0907)',
        bar: 'width:' + v + '%;background:linear-gradient(90deg,' + L[1] + '88,' + L[1] + ');box-shadow:0 0 10px ' + L[1] + '66',
        eat: () => { const s = sat.slice(); s[i] = Math.min(100, s[i] + foods[sel].s); this.setState({ sat: s, last: i }); }
      };
    });
    return { groups, chars, selName: foods[sel].n };
  }
}
</script>
</body>
</html>

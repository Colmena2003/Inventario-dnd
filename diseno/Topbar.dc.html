<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra superior</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="position: relative; width: 1920px; height: 72px; box-sizing: border-box; display: grid; grid-template-columns: 300px 1fr 600px; align-items: center; padding: 0 24px; background: linear-gradient(180deg, #110e0b 0%, #0a0807 100%); border-bottom: 1px solid #4d3e25; box-shadow: 0 1px 0 #1c160e, 0 8px 28px rgba(0,0,0,.65); font-family: 'Alegreya Sans', system-ui, sans-serif; color: #e8dfcc">
  <div style="display: flex; align-items: center; gap: 12px">
    <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true" style="flex: none">
      <path d="M20 2l16 9v18l-16 9-16-9V11z" fill="#120f0b" stroke="#a88a4c" stroke-width="1.2"></path>
      <path d="M20 7l11 6.3v13.4L20 33 9 26.7V13.3z" fill="none" stroke="#5e4c2b" stroke-width="1"></path>
      <path d="M12 21h16v7H12zM12 21a8 5 0 0 1 16 0M18.6 22.5h2.8v3h-2.8z" fill="none" stroke="#e2c27a" stroke-width="1.3" stroke-linejoin="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 18px; letter-spacing: .08em; color: #e2c27a">Cofre de la Compañía</span>
      <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9d917b">Inventario de la party</span>
    </div>
  </div>
  <nav aria-label="Secciones" style="display: flex; justify-content: center; gap: 10px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="{{t.style}}">
        <span style="{{t.dot}}">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.d}}"></path></svg>
        </span>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 14px">
    <a href="Monedas.dc.html" aria-label="Tesoro común de la party" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid #3c311f; border-radius: 4px; background: #0e0b09; text-decoration: none; color: #e8dfcc">
      <span style="font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #9d917b">Tesoro</span>
      <sc-for list="{{coins}}" as="m" hint-placeholder-count="5">
        <span style="display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 500">
          <span style="{{m.style}}">{{m.k}}</span>{{m.v}}
        </span>
      </sc-for>
    </a>
    <label style="position: relative; display: flex; align-items: center">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar objetos</span>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="position: absolute; left: 12px; fill: none; stroke: #9d917b; stroke-width: 1.8; stroke-linecap: round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM16 16l4.5 4.5"></path></svg>
      <input type="search" placeholder="Buscar objetos…" style="width: 160px; height: 40px; box-sizing: border-box; padding: 0 12px 0 36px; border: 1px solid #4d3e25; border-radius: 20px; background: #0b0907; color: #e8dfcc; font: 15px 'Alegreya Sans', sans-serif; outline: none">
    </label>
    <button type="button" aria-label="Filtros de búsqueda" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #4d3e25; border-radius: 50%; background: #0b0907; color: #c9b88f; cursor: pointer">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>
    </button>
  </div>
  <svg viewBox="0 0 600 14" width="600" height="14" aria-hidden="true" style="position: absolute; left: 660px; bottom: -7px">
    <path d="M0 7h270M330 7h270" stroke="#6b5631" stroke-width="1"></path>
    <path d="M300 1l7 6-7 6-7-6z" fill="#0a0807" stroke="#b89a55" stroke-width="1"></path>
    <path d="M276 7l6-4M276 7l6 4M324 7l-6-4M324 7l-6 4" stroke="#b89a55" stroke-width="1" fill="none"></path>
  </svg>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["grupal","individual","estadisticas","crafteo","despensa","ninguna"],"default":"grupal"},"$preview":{"width":1920,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'grupal';
    const tabs = [
      { id: 'grupal', label: 'Inventario grupal', href: 'Main.dc.html', d: 'M3 11h18v9H3zM3 11a9 6 0 0 1 18 0M10.5 13h3v3.5h-3z' },
      { id: 'individual', label: 'Inventarios individuales', href: 'Individual.dc.html', d: 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5' },
      { id: 'estadisticas', label: 'Estadísticas', href: 'Estadisticas.dc.html', d: 'M12 3l8 4.6v8.8L12 21l-8-4.6V7.6zM12 8l4 2.3v4.4L12 17l-4-2.3v-4.4z' },
      { id: 'crafteo', label: 'Crafteo', href: 'Crafteo.dc.html', d: 'M13 4l7 7-2.5 2.5-7-7zM10.5 9.5L3 17l3 3 7.5-7.5' },
      { id: 'despensa', label: 'Despensa', href: 'Despensa.dc.html', d: 'M3 11h18a9 9 0 0 1-18 0zM8.5 8c0-1 1-1.2 1-2.2S8.5 4.5 8.5 3.5M12 8c0-1 1-1.2 1-2.2S12 4.5 12 3.5M15.5 8c0-1 1-1.2 1-2.2s-1-1.3-1-2.3' }
    ].map((t) => {
      const on = t.id === active;
      return {
        ...t,
        cur: on ? 'page' : 'false',
        style: 'display:flex;align-items:center;gap:10px;height:42px;padding:0 16px 0 5px;border-radius:21px;text-decoration:none;font-family:Cinzel,serif;font-size:13.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;' +
          (on ? 'color:#f6ead0;background:linear-gradient(180deg,#1f5560 0%,#113139 100%);border:1px solid #c8a85e;box-shadow:0 0 0 1px #0a0807,0 0 18px rgba(64,170,190,.28),inset 0 1px 0 rgba(255,255,255,.12)'
              : 'color:#c9b88f;background:linear-gradient(180deg,#1a1611 0%,#0f0c0a 100%);border:1px solid #574628;box-shadow:inset 0 1px 0 rgba(255,235,190,.05)'),
        dot: 'width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;' +
          (on ? 'background:#0c2328;border:1px solid #c8a85e;color:#f1d692' : 'background:#0d0b09;border:1px solid #4d3e25;color:#a8956a')
      };
    });
    const coin = (bg, fg) => 'width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:' + fg + ';background:radial-gradient(circle at 35% 30%,#fff8 0,transparent 45%),' + bg + ';box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)';
    const coins = [
      { k: 'PPT', v: '12', style: coin('#c9d3dc', '#1d252c') },
      { k: 'PO', v: '1.248', style: coin('#d9a83c', '#2b1d05') },
      { k: 'PE', v: '4', style: coin('#bcb67a', '#24210c') },
      { k: 'PP', v: '86', style: coin('#a9adb3', '#1c1e21') },
      { k: 'PC', v: '340', style: coin('#b06d43', '#24120a') }
    ];
    return { tabs, coins };
  }
}
</script>
</body>
</html>
